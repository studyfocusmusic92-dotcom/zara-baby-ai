<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zara Baby AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:flex;flex-direction:column;align-items:center;background:linear-gradient(#0f0a1a,#2a1745);color:#fff;font-family:sans-serif}
#avatar{width:110px;height:110px;border-radius:50%;background:radial-gradient(#e9b8ff,#b36ef0);display:flex;align-items:center;justify-content:center;font-size:60px;margin-top:14px;box-shadow:0 0 30px #b36ef0;flex-shrink:0}
#avatar.talking{animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
h1{color:#e9c8ff;font-size:24px;margin:8px 0 2px}
#status{font-size:13px;color:#cfa8ee;min-height:18px}
#chat{flex:1;min-height:0;width:100%;max-width:600px;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:10px 14px;border-radius:16px;font-size:16px;line-height:1.4;white-space:pre-wrap}
.bot{background:#2b2144;align-self:flex-start}
.user{background:#7b47a8;align-self:flex-end}
#bar,#row{display:flex;gap:8px;width:100%;max-width:600px;padding:6px 14px}
#row{padding-bottom:16px}
#msg{flex:1;padding:12px;border-radius:12px;border:1px solid #7b47a8;background:#150f26;color:#fff;font-size:16px}
button{border:0;border-radius:12px;background:#d9a3ff;color:#1a0d2e;font-weight:bold;font-size:16px;padding:12px 16px}
#row button{flex:1}
</style>
</head>
<body>
<div id="avatar">👩</div>
<h1>💜 Zara Baby AI</h1>
<div id="status"></div>
<div id="chat"></div>
<div id="bar">
  <input id="msg" placeholder="Zara se baat karo...">
  <button id="send">Send</button>
</div>
<div id="row">
  <button id="voice">🎙️ Voice</button>
  <button id="sound">🔇 Awaaz OFF</button>
</div>

<script>
const chat = document.getElementById("chat");
const msg = document.getElementById("msg");
const statusEl = document.getElementById("status");
const avatar = document.getElementById("avatar");
const soundBtn = document.getElementById("sound");
let history = [];
let soundOn = false;

function add(text, who) {
  const d = document.createElement("div");
  d.className = "m " + who;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function speak(text) {
  if (!soundOn || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const clean = text.replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu, "");
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = "hi-IN";
  const v = speechSynthesis.getVoices().find(x => x.lang.startsWith("hi"));
  if (v) u.voice = v;
  u.onstart = () => avatar.classList.add("talking");
  u.onend = u.onerror = () => avatar.classList.remove("talking");
  speechSynthesis.speak(u);
}

async function send(text) {
  text = text.trim();
  if (!text) return;
  add(text, "user");
  msg.value = "";
  statusEl.textContent = "Zara soch rahi hai...";
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history: history.slice(-10) })
    });
    const data = await res.json();
    const reply = data.reply || "Arre, kuch gadbad ho gayi 🥺";
    history.push({ role: "user", content: text }, { role: "assistant", content: reply });
    add(reply, "bot");
    speak(reply);
    statusEl.textContent = "";
  } catch (e) {
    add("Arre, kuch gadbad ho gayi 🥺 thodi der baad phir try karo.", "bot");
    statusEl.textContent = "Error: " + e.message;
  }
}

document.getElementById("send").onclick = () => send(msg.value);
msg.addEventListener("keydown", e => { if (e.key === "Enter") send(msg.value); });

soundBtn.onclick = () => {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? "🔊 Awaaz ON" : "🔇 Awaaz OFF";
  if (!soundOn && window.speechSynthesis) speechSynthesis.cancel();
};

document.getElementById("voice").onclick = () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { statusEl.textContent = "Is browser mein voice nahi chalta"; return; }
  const r = new SR();
  r.lang = "hi-IN";
  r.onstart = () => statusEl.textContent = "Sun rahi hoon...";
  r.onresult = e => send(e.results[0][0].transcript);
  r.onerror = () => statusEl.textContent = "Voice error, phir try karo";
  r.start();
};

add("Namaste! 💜 Main Zara hoon. Aaj main aapki kis tarah madad kar sakti hoon?", "bot");
</script>
</body>
</html>
